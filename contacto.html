<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SL - Formulario de inscripción</title>
    <link rel="stylesheet" href="assets/css/Index.css">
    <script src="assets/js/Javascript.js" defer></script>

</head>
<body>
    <header>
        <div>
            <img src="assets/img/LOGO-SL-CARRERAS.png" alt="Logo" width="80">
            <h1>SL - Carreras</h1>
        </div>
        <div>
            <nav>
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="carreras.html">Carreras</a></li>
                    <li><a href="contacto.html" class="activo">Formulario</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div id="presentacion">
            <h2>Inscribite</h2>
            <p>Completá tus datos y elegí la carrera. Los campos marcados con * son obligatorios.</p>
        </div>

        <hr>

        <div id="DIVformulario">
            <form id="formulario" action="mailto:slcarreras@edu.ar" method="post" enctype="text/plain">
                <h3>Formulario de inscripción</h3>
                <img src="assets/img/LOGO-SL-CARRERAS.png" id="DentroFormulario" alt="Logo" >
                <div>
                    <label for="nombre" class="formularioLabel">Nombre y apellido *</label>
                    <input type="text" id="nombre" name="nombre" class="formularioInput" autocomplete="name" required>
                </div>
                <div>
                    <label for="apellido" class="formularioLabel">Apellido *</label>
                    <input type="text" id="apellido" name="apellido" class="formularioInput" autocomplete="family-name" required>
                </div>
                <div>
                    <label for="dni" class="formularioLabel">DNI *</label>
                    <input type="text" id="dni" name="dni" class="formularioInput" autocomplete= "off" required>
                </div>
                <div>
                    <label for="email" class="formularioLabel">Email *</label>
                    <input type="email" id="email" name="email" class="formularioInput" autocomplete="email" required>
                </div>
                <div>
                    <label for="telefono" class="formularioLabel">Teléfono</label>
                    <input type="tel" id="telefono" class="formularioInput" name="telefono" autocomplete="tel">
                </div>
                <div>
                    <label for="carrera" class="formularioLabel">Carrera *</label>
                    <select id="carrera" name="carrera" required>
                        <option value="">Elegí una carrera</option>
                        <option value="programacion">Tecnicatura en Programación</option>
                        <option value="administracion">Licenciatura en Administración</option>
                        <option value="contador">Contador Público</option>
                        <option value="diseno">Diseño Gráfico</option>
                    </select>
                </div>
                    <label for="consulta" class="formularioLabel">Consulta</label>
                    <textarea id="consulta" name="consulta" rows="4" class="formularioInput"></textarea>
                </div>
                <button type="submit" id="btnEnviar"s>Enviar inscripción</button>
            </form>
        </div>
    </main>

    <div id="footer"></div>
</body>
</html>
